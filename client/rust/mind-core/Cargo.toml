[package]
name = "mind-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Godot-free, tokio-free Mindustry simulation core (content, world, io, campaign)."

[dependencies]
bevy_ecs.workspace = true
mind-derive = { path = "../mind-derive" }
mind-macros = { path = "../mind-macros" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap.workspace = true
smallvec.workspace = true
log.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true
flate2.workspace = true
sha2.workspace = true
zip.workspace = true
data-encoding.workspace = true
# Plan 19 / OD19-D: PNG image-map + preview codec (`io::map::encode_png`/`decode_png`).
png.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "io"
harness = false

[[bench]]
name = "assets"
harness = false

[[bench]]
name = "world"
harness = false

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[features]
# OD2 / NUD-02: one-way legacy `MSAV` importer. Default-off; currently a
# declined stub (`io::legacy` errors with the upstream unknown-version message)
# until an explicit user opt-in lands `legacy::java` readers (plan 04 M7).
msav-import = []
# Plan 05 M8 §7.4: installs a counting global allocator so the harness can
# prove steady-state ticks are allocation-free. Default-off (test/bench only).
alloc-audit = []
# Plan 23 M4: per-tick building-update cost attribution (`world::update::profile`).
# Default-off; the `mind-headless` bench harness opts in with `--features
# profile-build` so no instrumentation is compiled into normal/release builds.
profile-build = []
