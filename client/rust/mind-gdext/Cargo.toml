[package]
name = "mind-gdext"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Godot 4.7 GDExtension (view drivers, input, frame pump) for Mindustry-Godot."

[lib]
crate-type = ["cdylib"]

[dependencies]
godot.workspace = true
# `msav-import`: campaign preset sectors load their upstream `assets/maps/**.msav`
# designed maps (EV-0014) instead of the planet generator fallback.
mind-core = { path = "../mind-core", features = ["msav-import"] }
mind-stdb = { path = "../mind-stdb" }
serde_json.workspace = true
smallvec.workspace = true
log.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"

[features]
# Plan 22 M4/OD4: compile the optional Discord RPC seam. Default off; even when
# enabled no plugin is linked, so the game starts cleanly with a disabled notice.
default = []
discord = []
