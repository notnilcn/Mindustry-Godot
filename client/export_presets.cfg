; Ported from Mindustry (https://github.com/Anuken/Mindustry) — GPL-3.0.
; Godot export presets (plan 22 §3.1/§6.8; I07 T7). Windows Desktop and
; Linux/X11 are the desktop presets. Android/iOS presets are appended when
; their milestones land. The exported PCK embeds the mind-gdext GDExtension
; from res://bin/rust/ and finds the game data in an `assets/` directory next
; to the binary (tools/export.sh --with-assets; resolver order in
; client/rust/mind-gdext/src/assets/loader.rs).

[presets]

count=2

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/export/Mindustry-Godot.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

