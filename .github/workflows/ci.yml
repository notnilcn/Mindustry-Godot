# SPDX-License-Identifier: GPL-3.0-only
#
# P0 CI (`00_FOUNDATION_IMPLEMENTATION_PLAN.md` §3.8):
#   rust       fmt / clippy / check / mind-core tests / headless goldens /
#              bench budget / boundary greps (ubuntu + windows)
#   matrix-check plan-23 parity registries + harness goldens + T0 smoke (23 §7f)
#   spacetimedb STDB module typecheck + generated-bindings drift gate
#   godot-import build the GDExtension, download pinned Godot 4.7.2, run the
#              headless editor import/parse check
#   export-smoke (manual/nightly, I07 T8) release build + pack + Linux export,
#              then launch the export headless and check it found its assets
#
# The interactive MCP smoke (`tools/mcp-smoke.sh`) is local-only: it needs a
# running editor + display and is never run here. No secrets are used.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly run for the heavy export-smoke job (gated below).
    - cron: '43 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep

      - name: cargo fmt (workspace --check)
        shell: bash
        run: cargo fmt --manifest-path client/rust/Cargo.toml --all -- --check

      - name: cargo clippy (workspace --all-targets -- -D warnings)
        shell: bash
        run: cargo clippy --manifest-path client/rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: cargo check (workspace)
        shell: bash
        run: cargo check --manifest-path client/rust/Cargo.toml --workspace

      - name: cargo test -p mind-core
        shell: bash
        run: cargo test --manifest-path client/rust/Cargo.toml -p mind-core

      - name: headless goldens
        shell: bash
        run: |
          cargo run -q --manifest-path client/rust/Cargo.toml -p mind-headless -- run spine_place_break --json > /dev/null
          cargo run -q --manifest-path client/rust/Cargo.toml -p mind-headless -- run spine_determinism --json > /dev/null
          cargo run -q --manifest-path client/rust/Cargo.toml -p mind-headless -- run spine_many_commands --json > /dev/null

      - name: bench budget (+20% warn / +50% fail vs 101/240 ns)
        shell: bash
        run: |
          set -euo pipefail
          BASE_P50_NS=101
          BASE_P99_NS=240
          FAIL_P50_NS=$((BASE_P50_NS * 150 / 100))
          FAIL_P99_NS=$((BASE_P99_NS * 150 / 100))
          BENCH_JSON="$(cargo run -q --release --manifest-path client/rust/Cargo.toml -p mind-headless -- bench --ticks 100000 --scenario bench_baseline || true)"
          echo "$BENCH_JSON"
          P50_NS="$(printf '%s' "$BENCH_JSON" | sed -n 's/.*"p50_ns":\([0-9][0-9]*\).*/\1/p')"
          P99_NS="$(printf '%s' "$BENCH_JSON" | sed -n 's/.*"p99_ns":\([0-9][0-9]*\).*/\1/p')"
          STATUS="$(printf '%s' "$BENCH_JSON" | sed -n 's/.*"baseline_status":"\([a-z-]*\)".*/\1/p')"
          if [ -z "$P50_NS" ] || [ -z "$P99_NS" ]; then
            echo "FAIL: could not parse bench JSON" >&2
            exit 1
          fi
          if [ "$STATUS" = "fail" ] || [ "$P50_NS" -gt "$FAIL_P50_NS" ] || [ "$P99_NS" -gt "$FAIL_P99_NS" ]; then
            echo "FAIL: bench regression beyond +50% (p50 ${P50_NS}ns, p99 ${P99_NS}ns)" >&2
            exit 1
          fi
          if [ "$P50_NS" -gt $((BASE_P50_NS * 120 / 100)) ] || [ "$P99_NS" -gt $((BASE_P99_NS * 120 / 100)) ]; then
            echo "WARN: bench regression beyond +20% (p50 ${P50_NS}ns, p99 ${P99_NS}ns)"
          fi

      - name: boundary greps (mind-core is godot-free and tokio-free)
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --manifest-path client/rust/Cargo.toml -p mind-core --prefix none | grep -Eq '^(godot|tokio)( |$)'; then
            echo "FAIL: mind-core dependency tree contains godot/tokio" >&2
            exit 1
          fi
          if grep -RnE --include='*.rs' 'use (godot|tokio)' client/rust/mind-core; then
            echo "FAIL: mind-core source imports godot/tokio" >&2
            exit 1
          fi

      - name: scenario mirror sync check (scenarios/ -> client/scenarios/)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/sync_scenarios.sh
          diff -r scenarios client/scenarios

  # Plan 23 §7f: matrix + registry drift + harness-golden sha256 + T0 catalog
  # smoke. Read-only; needs no Godot/GPU/JVM, so it is safe on shared runners.
  # `--tests` turns on the "every landed matrix row resolves" gate; `parity
  # goldens` re-checked on every push/PR so a re-recorded harness golden must
  # update parity/golden_manifest.json in the same commit.
  matrix-check:
    name: matrix-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: parity check + goldens + T0 smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path client/rust/Cargo.toml -p mind-core     -- --list > tests-core.txt
          cargo test --manifest-path client/rust/Cargo.toml -p mind-headless -- --list > tests-headless.txt
          cat tests-core.txt tests-headless.txt > tests.txt
          cargo run -q --manifest-path client/rust/Cargo.toml -p mind-headless -- parity check --tests tests.txt
          cargo run -q --manifest-path client/rust/Cargo.toml -p mind-headless -- parity goldens
          cargo run -q --manifest-path client/rust/Cargo.toml -p mind-headless -- run-all --tier T0

  spacetimedb:
    name: spacetimedb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Install SpacetimeDB CLI 2.10.1
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- -y
          "$HOME/.local/bin/spacetime" version install 2.10.1 --use -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo check server/spacetimedb (--tests)
        run: cargo check --manifest-path server/spacetimedb/Cargo.toml --tests

      - name: bindings drift gate (server/build.sh --check, no publish)
        run: bash server/build.sh --check

  godot-import:
    name: godot-import
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev unzip

      # mind.gdextension expects res://bin/rust/<profile>/libmind_gdext.so on
      # Linux; building here (debug profile) is what makes the editor import
      # below load the extension successfully.
      - name: Build GDExtension (client/bin/rust/debug/libmind_gdext.so)
        run: cargo build --manifest-path client/rust/Cargo.toml -p mind-gdext --target-dir client/bin/rust

      - name: Download pinned Godot 4.7.2 (standard)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o /tmp/godot.zip "$URL"
          unzip -q /tmp/godot.zip -d /tmp/godot
          BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*' | head -n 1)"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Godot headless editor import/parse check
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          "$GODOT_BIN" --headless --editor --quit --path client >"$LOG" 2>&1
          cat "$LOG"
          # Godot prints a benign `ERROR: <n> resources still in use at exit`
          # cleanup line on every headless editor quit; drop it first.
          if grep -nE 'SCRIPT ERROR|SHADER ERROR|Parse Error|Failed to load|Cannot open|Can.t open|ERROR:' "$LOG" \
              | grep -vE 'resources still in use at exit'; then
            echo "FAIL: Godot headless import logged parse/load errors" >&2
            exit 1
          fi

  # I07 T8 (PAR-0119): manual/nightly export smoke. Proves an exported build
  # boots with the `assets/` directory beside the binary (resolver steps 4-5 in
  # client/rust/mind-gdext/src/assets/loader.rs) instead of the placeholder
  # quads. Heavy (templates + release build + pack), so push/PR skip it.
  export-smoke:
    name: export-smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev unzip curl

      - name: Download pinned Godot 4.7.2 (standard)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o /tmp/godot.zip "$URL"
          unzip -q /tmp/godot.zip -d /tmp/godot
          BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*' | head -n 1)"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Install Godot 4.7.2 export templates
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -sSL -o /tmp/templates.tpz "$URL"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"

      - name: Build release GDExtension (client/bin/rust/release/libmind_gdext.so)
        run: tools/build.sh --release

      - name: Pack assets
        run: tools/pack.sh pack

      - name: Export Linux (binary with assets/ beside it)
        run: tools/export.sh linux --verify

      - name: Launch the export headless (300 frames) and check the assets root
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          set +e
          timeout 300 client/bin/export/Mindustry-Godot.x86_64 --headless --quit-after 300 >"$LOG" 2>&1
          STATUS=$?
          set -e
          cat "$LOG"
          if [ "$STATUS" -ne 0 ]; then
            echo "FAIL: export exited with status $STATUS" >&2
            exit 1
          fi
          if grep -n 'missing manifest' "$LOG"; then
            echo "FAIL: exported build did not resolve its assets directory" >&2
            exit 1
          fi
          # The loader logs the chosen root once. In an export the exe-dir
          # assets/ is reached through Godot's res:// -> executable-dir
          # fallback (step 4, then step 5 in loader.rs), so accept either.
          grep -nE '\[assets\] assets root: .*\(source: (res://assets|exe-dir assets)\)' "$LOG"
